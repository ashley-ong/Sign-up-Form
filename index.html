<!DOCTYPE html>
<link rel="stylesheet" href="form.css">

<html>
<head>
    <title>Sign-Up Form</title>
</head>
<body>
    <div id="page-layout">
        <div id="left-title-box">
            <div id="left-title-content">
                <img src="odin-lined.png" alt="Odin Logo">
                <h1>ODIN</h1>
            </div>
        </div>
        <div id="right-info-box">
            <div id="info-texts">
                <h2>Sign up <em>now</em> to get started.</h2>
                <h2>You <em>know</em> you want to.</h2>
            </div>
            <div id="form-inputs-section">
                <h2>Let's do this!</h2>
                <div id="labels-inputs">
                    <div id="left-inputs">
                        <div class="vert-inputs">
                            <label for="first_name">First Name</label>
                            <input type="text" id="first_name" name="first_name">
                        </div>
                        <div class="vert-inputs">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="vert-inputs">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password">
                        </div>
                    </div>
                    <div id="right-inputs">
                        <div class="vert-inputs">
                            <label for="last_name">Last Name</label>
                            <input type="last_name" id="last_name" name="last_name">
                        </div>
                        <div class="vert-inputs">
                            <label for="phone_number">Phone Number</label>
                            <input type="tel" id="phone_number" name="phone_number">
                        </div>
                        <div class="vert-inputs">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password">
                        </div>
                    </div>
                </div>
            </div>

            <div id="third-right-box">
                <button>Create Account</button>

                <h3>Already have an account? <em id="log-in">Log In</em></h3>
            </div>
        </div>
    </div>
</body>
</html>
